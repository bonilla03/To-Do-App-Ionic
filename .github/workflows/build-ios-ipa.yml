name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: Export method for the IPA
        required: true
        default: development
        type: choice
        options:
          - development
          - ad-hoc
          - app-store

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
        working-directory: todo-accenture

    env:
      IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISION_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: todo-accenture/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:web

      - name: Add iOS platform
        run: npx cordova platform add ios

      - name: Prepare iOS platform
        run: npx cordova prepare ios

      - name: Install Apple certificate and provisioning profile
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          CERT_PATH="$RUNNER_TEMP_DIR/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP_DIR/build_profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP_DIR/build.keychain-db"

          echo -n "$IOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          echo -n "$IOS_PROVISION_PROFILE" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Resolve generated Xcode scheme
        id: scheme
        run: |
          PROJECT_PATH=$(find platforms/ios -maxdepth 1 -name '*.xcodeproj' | head -n 1)
          if [ -z "$PROJECT_PATH" ]; then
            echo "No Xcode project found under platforms/ios"
            exit 1
          fi

          SCHEME=$(python3 - <<'PY'
import json
import subprocess
import sys

project = subprocess.check_output("find platforms/ios -maxdepth 1 -name '*.xcodeproj' | head -n 1", shell=True, text=True).strip()
data = json.loads(subprocess.check_output(["xcodebuild", "-list", "-json", "-project", project], text=True))
schemes = [s for s in data.get("project", {}).get("schemes", []) if s != "CordovaLib"]
print(schemes[0] if schemes else "")
PY
)

          if [ -z "$SCHEME" ]; then
            echo "Could not resolve Xcode scheme"
            exit 1
          fi

          echo "project_path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Create ExportOptions.plist
        env:
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Archive app
        env:
          PROJECT_PATH: ${{ steps.scheme.outputs.project_path }}
          SCHEME: ${{ steps.scheme.outputs.scheme }}
        run: |
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            clean archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      - name: Export IPA
        env:
          SCHEME: ${{ steps.scheme.outputs.scheme }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/ipa/*.ipa
            ${{ runner.temp }}/*.xcarchive

